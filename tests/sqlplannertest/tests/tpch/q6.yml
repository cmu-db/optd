- sql: |
    SELECT
        SUM(l_extendedprice * l_discount) AS revenue_loss
    FROM
        lineitem
    WHERE
        l_shipdate >= DATE '1994-01-01'
        AND l_shipdate < DATE '1995-01-01'
        AND l_discount BETWEEN 0.05 AND 0.07
        AND l_quantity < 24;
  desc: TPC-H Q6
  before: ["include_sql:schema.sql", "include_sql:strict.sql"]
  tasks:
    - explain
    - execute
