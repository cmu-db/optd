[package]
name = "optd-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json", "arrow-schema/serde", "optd-sketches/serde"]

[dependencies]
anstyle = "1.0"
arrow-schema = "58.3.0"
fixedbitset = "0.5"
log = "0.4"
optd-sampling = { path = "../sampling" }
optd-sketches = { path = "../sketches", default-features = false }
serde = { version = "1.0", features = ["derive", "rc"], optional = true }
serde_json = { version = "1.0", optional = true }
substrait = "0.63.0"

[dev-dependencies]
arrow-array = "58.3.0"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
